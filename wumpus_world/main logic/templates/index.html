<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wumpus Tactical OS - Amber Edition</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: rgba(28, 25, 23, 0.9);
            --accent: #f59e0b;
            --safe: #10b981;
            --danger: #ef4444;
            --text: #fafaf9;
            --grid-bg: #1c1917;
        }

        body {
            font-family: 'Consolas', 'Monaco', monospace;
            background: var(--bg);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(245, 158, 11, 0.03) 1px, rgba(245, 158, 11, 0.03) 2px);
            color: var(--text);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            /* Swapped order: Grid first (left), Sidebar second (right) */
            flex-direction: row;
            gap: 50px;
            min-height: 100vh;
        }

        .grid-container {
            display: grid;
            gap: 8px;
            background: #000;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #262626;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            order: 1;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: var(--grid-bg);
            border: 1px solid #444;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cell.visited {
            background: #292524;
            border-color: var(--accent);
            box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.1);
        }

        .cell.safe {
            border: 2px solid var(--safe);
            background: rgba(16, 185, 129, 0.05);
        }

        .sidebar {
            background: var(--panel);
            padding: 30px;
            border-radius: 4px;
            width: 340px;
            border: 1px solid #444;
            box-shadow: 10px 10px 0px var(--accent);
            order: 2;
        }

        h1 {
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 25px;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 10px;
        }

        .status-box {
            background: #000;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px dashed var(--accent);
        }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            padding: 12px;
            color: var(--accent);
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.2s;
            text-transform: uppercase;
            font-family: inherit;
        }

        button:hover {
            background: var(--accent);
            color: #000;
            font-weight: bold;
        }

        button.danger-zone {
            border-color: var(--danger);
            color: var(--danger);
        }

        button.danger-zone:hover {
            background: var(--danger);
            color: white;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 30px;
        }

        .d-pad button {
            margin-bottom: 0;
            padding: 15px;
            background: #262626;
        }

        .agent-icon {
            filter: drop-shadow(0 0 5px var(--accent));
        }

        .hidden-item {
            opacity: 0;
            filter: grayscale(1) blur(5px);
            transition: 0.5s;
        }

        .god-mode-active .hidden-item {
            opacity: 0.3;
            filter: none;
        }

        .visited .hidden-item {
            opacity: 1;
            filter: none;
        }
    </style>
</head>

<body>
    <div class="grid-container" id="gridUI"></div>

    <div class="sidebar">
        <h1>Control Console</h1>

        <div class="status-box">
            <div style="font-size: 10px; opacity: 0.8; margin-bottom: 8px;">SCAN RADIUS (GRID SIZE)</div>
            <input type="range" id="gridSize" value="5" min="3" max="8" style="width:100%; accent-color: var(--accent);"
                oninput="this.nextElementSibling.value = this.value">
            <output style="font-weight: bold; color: var(--accent); display: block; text-align: center;">5</output>
        </div>

        <button onclick="apiCreateGrid()">Init System Map</button>
        <button onclick="toggleGodMode()" class="danger-zone">Visual Override</button>
        <button onclick="toggleAutoMove()" id="aiBtn" style="border-color: #d946ef; color: #d946ef;">Deploy
            Auto-Probe</button>

        <div class="status-box" style="margin-top: 20px;">
            <div style="font-size: 10px; opacity: 0.8;">DIAGNOSTICS</div>
            <div style="margin: 10px 0; font-size: 14px;">Inference: <span id="steps"
                    style="color: var(--accent)">0</span></div>
            <div id="percepts" style="font-size: 11px; color: #fbbf24; border-top: 1px solid #333; padding-top: 5px;">
                Awaiting Signal...</div>
        </div>

        <div class="d-pad">
            <div></div><button onclick="apiMove('up')">↑</button>
            <div></div>
            <button onclick="apiMove('left')">←</button>
            <button onclick="apiMove('down')">↓</button>
            <button onclick="apiMove('right')">→</button>
        </div>
    </div>

    <script>
        let gridSize = 5;
        let backendGrid = null;
        let agentPos = { row: 0, col: 0 };
        let safeCells = [];
        let visitedCells = [];
        let isGameOver = false;
        let autoMoveInterval = null;

        async function apiCreateGrid() {
            gridSize = parseInt(document.getElementById('gridSize').value);
            const res = await fetch('/create_grid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rows: gridSize, cols: gridSize })
            });
            const data = await res.json();
            backendGrid = data.grid;

            agentPos = { row: 0, col: 0 };
            safeCells = [];
            visitedCells = [{ row: 0, col: 0 }];
            isGameOver = false;

            document.getElementById('steps').textContent = "0";
            document.getElementById('percepts').textContent = "Scanner Linked";

            if (autoMoveInterval) toggleAutoMove();
            buildGridUI();
        }

        async function apiMove(action) {
            if (isGameOver) return;
            const res = await fetch('/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            });

            if (res.ok) {
                const data = await res.json();
                agentPos = data.agent_pos;
                safeCells = data.safe_cells || [];
                visitedCells = data.visited_cells;

                document.getElementById('steps').textContent = data.inference_steps;
                document.getElementById('percepts').textContent = data.current_percepts;
                buildGridUI();

                if (data.game_over) {
                    isGameOver = true;
                    if (autoMoveInterval) toggleAutoMove();
                    alert(data.victory ? "OBJECTIVE REACHED" : "SIGNAL LOST: " + data.death_reason);
                }
            }
        }

        function toggleGodMode() {
            document.getElementById('gridUI').classList.toggle('god-mode-active');
        }

        function toggleAutoMove() {
            const btn = document.getElementById('aiBtn');
            if (autoMoveInterval) {
                clearInterval(autoMoveInterval);
                autoMoveInterval = null;
                btn.innerText = "Deploy Auto-Probe";
                btn.style.color = "#d946ef";
                btn.style.borderColor = "#d946ef";
                btn.style.background = "transparent";
            } else {
                if (isGameOver) return alert("System Reset Required.");
                autoMoveInterval = setInterval(performAIMove, 400);
                btn.innerText = "Abort Auto-Probe";
                btn.style.color = "white";
                btn.style.background = "var(--danger)";
                btn.style.borderColor = "var(--danger)";
            }
        }

        async function performAIMove() {
            if (isGameOver) return;
            const directions = [{ n: 'up', r: -1, c: 0 }, { n: 'down', r: 1, c: 0 }, { n: 'left', r: 0, c: -1 }, { n: 'right', r: 0, c: 1 }];
            let safeUnvisited = [], visited = [], risky = [];

            for (let d of directions) {
                let nr = agentPos.row + d.r, nc = agentPos.col + d.c;
                if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
                    let isV = visitedCells.some(v => v.row === nr && v.col === nc);
                    let isS = safeCells.some(s => s.row === nr && s.col === nc);
                    if (!isV && isS) safeUnvisited.push(d.n);
                    else if (isV) visited.push(d.n);
                    else risky.push(d.n);
                }
            }

            let move = safeUnvisited.length ? safeUnvisited[0] : (visited.length ? visited[Math.floor(Math.random() * visited.length)] : risky[0]);
            if (move) await apiMove(move);
            else toggleAutoMove();
        }

        function buildGridUI() {
            const container = document.getElementById('gridUI');
            container.style.gridTemplateColumns = `repeat(${gridSize}, 80px)`;
            container.innerHTML = '';

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (visitedCells.some(v => v.row === r && v.col === c)) cell.classList.add('visited');
                    if (safeCells.some(s => s.row === r && s.col === c)) cell.classList.add('safe');

                    let icon = '';
                    if (backendGrid.gold.row === r && backendGrid.gold.col === c) icon = '<span class="hidden-item">💰</span>';
                    else if (backendGrid.wumpus.row === r && backendGrid.wumpus.col === c) icon = '<span class="hidden-item">👹</span>';
                    else if (backendGrid.pits.some(p => p.row === r && p.col === c)) icon = '<span class="hidden-item">🌑</span>';
                    cell.innerHTML = icon;

                    if (agentPos.row === r && agentPos.col === c) {
                        const agent = document.createElement('span');
                        agent.className = 'agent-icon';
                        agent.innerText = isGameOver && !document.getElementById('percepts').innerText.includes("Glitter") ? '❌' : '🤖';
                        cell.appendChild(agent);
                    }
                    container.appendChild(cell);
                }
            }
        }
        apiCreateGrid();
    </script>
</body>

</html>
